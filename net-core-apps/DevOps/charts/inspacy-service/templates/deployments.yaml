{{- include "inspacy-service.validate" . -}}
{{- if .Values.service.enabled }}
{{- range $role := list "api" "consumer" "job" }}
{{- $settings := index $.Values.roles $role }}
{{- if $settings.enabled }}
{{- $secretName := required (printf "roles.%s.secretName is required when that role is enabled" $role) $settings.secretName }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inspacy-service.roleName" (dict "root" $ "role" $role) }}
  labels:
{{ include "inspacy-service.commonLabels" $ | indent 4 }}
    inspacy.io/runtime-role: {{ $role }}
  {{- with $.Values.service.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  {{- if not $settings.autoscaling.enabled }}
  replicas: {{ $settings.replicas }}
  {{- end }}
  revisionHistoryLimit: {{ $.Values.rollout.revisionHistoryLimit }}
  minReadySeconds: {{ $.Values.rollout.minReadySeconds }}
  progressDeadlineSeconds: {{ $.Values.rollout.progressDeadlineSeconds }}
  strategy:
    {{- if eq $role "job" }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ $.Values.rollout.maxUnavailable }}
      maxSurge: {{ $.Values.rollout.maxSurge }}
    {{- end }}
  selector:
    matchLabels:
{{ include "inspacy-service.selectorLabels" (dict "root" $ "role" $role) | indent 6 }}
  template:
    metadata:
      labels:
{{ include "inspacy-service.selectorLabels" (dict "root" $ "role" $role) | indent 8 }}
      {{- with $.Values.service.podAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "inspacy-service.roleName" (dict "root" $ "role" $role) }}
      automountServiceAccountToken: {{ $.Values.service.automountServiceAccountToken }}
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      terminationGracePeriodSeconds: {{ $.Values.rollout.terminationGracePeriodSeconds }}
      securityContext:
{{ include "inspacy-service.podSecurityContext" $ | indent 8 }}
      {{- with $.Values.service.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $.Values.service.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: {{ $.Values.placement.minimumZones }}
          topologyKey: {{ $.Values.placement.topologyKeyZone }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
{{ include "inspacy-service.selectorLabels" (dict "root" $ "role" $role) | indent 14 }}
        - maxSkew: 1
          topologyKey: {{ $.Values.placement.topologyKeyNode }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
{{ include "inspacy-service.selectorLabels" (dict "root" $ "role" $role) | indent 14 }}
      containers:
        - name: app
          image: {{ include "inspacy-service.image" $ }}
          imagePullPolicy: {{ $.Values.service.image.pullPolicy }}
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
{{ include "inspacy-service.containerSecurityContext" $ | indent 12 }}
          {{- if gt (int $.Values.rollout.preStopDelaySeconds) 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $.Values.rollout.preStopDelaySeconds }}
          {{- end }}
          ports:
            - { name: http, containerPort: {{ $.Values.service.port }}, protocol: TCP }
          env:
            - name: Runtime__Role
              value: {{ include "inspacy-service.runtimeRole" $role | quote }}
          {{- if $settings.certificateSecretKey }}
            - name: SecretProvider__Certificate__Path
              value: /var/run/secrets/inspacy/secret-provider/client.pfx
          {{- end }}
          {{- range $name, $value := $.Values.service.commonEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
          {{- end }}
          {{- range $name, $value := $settings.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ $secretName }}
          startupProbe:
            httpGet: { path: {{ $.Values.probes.startup.path }}, port: http, scheme: HTTP }
            periodSeconds: {{ $.Values.probes.startup.periodSeconds }}
            failureThreshold: {{ $.Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ $.Values.probes.startup.timeoutSeconds }}
          livenessProbe:
            httpGet: { path: {{ $.Values.probes.liveness.path }}, port: http, scheme: HTTP }
            periodSeconds: {{ $.Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ $.Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ $.Values.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet: { path: {{ $.Values.probes.readiness.path }}, port: http, scheme: HTTP }
            periodSeconds: {{ $.Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ $.Values.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ $.Values.probes.readiness.timeoutSeconds }}
          resources:
{{ toYaml $settings.resources | indent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data-protection, mountPath: /home/app/.aspnet/DataProtection-Keys }
          {{- if $settings.certificateSecretKey }}
            - name: secret-provider-client-certificate
              mountPath: /var/run/secrets/inspacy/secret-provider
              readOnly: true
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: data-protection
          emptyDir: { sizeLimit: 16Mi }
      {{- if $settings.certificateSecretKey }}
        - name: secret-provider-client-certificate
          secret:
            secretName: {{ $secretName }}
            defaultMode: 288
            items:
              - key: {{ $settings.certificateSecretKey | quote }}
                path: client.pfx
                mode: 288
      {{- end }}
{{- end }}
{{- end }}
{{- end }}

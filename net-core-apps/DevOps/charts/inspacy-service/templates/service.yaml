{{- if and .Values.service.enabled .Values.roles.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "inspacy-service.fullname" . }}
  labels:
{{ include "inspacy-service.commonLabels" . | indent 4 }}
  {{- with .Values.service.serviceAnnotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
{{ include "inspacy-service.selectorLabels" (dict "root" . "role" "api") | indent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  sessionAffinity: None
{{- end }}


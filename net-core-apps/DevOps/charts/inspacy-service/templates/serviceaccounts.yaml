{{- if .Values.service.enabled }}
{{- range $role := list "api" "consumer" "job" }}
{{- $settings := index $.Values.roles $role }}
{{- if $settings.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "inspacy-service.roleName" (dict "root" $ "role" $role) }}
  labels:
{{ include "inspacy-service.commonLabels" $ | indent 4 }}
    inspacy.io/runtime-role: {{ $role }}
  {{- with $settings.serviceAccountAnnotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $.Values.service.automountServiceAccountToken }}
{{- end }}
{{- end }}
{{- if .Values.migration.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "inspacy-service.roleName" (dict "root" . "role" "migration") }}
  labels:
{{ include "inspacy-service.commonLabels" . | indent 4 }}
    inspacy.io/runtime-role: migration
  {{- if or .Values.migration.helmHook .Values.migration.serviceAccountAnnotations }}
  annotations:
  {{- with .Values.migration.serviceAccountAnnotations }}
{{ toYaml . | indent 4 }}
  {{- end }}
    {{- if .Values.migration.helmHook }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    # This dependency must outlive its own ready check and remain available
    # until the later-weighted migration Job finishes.
    helm.sh/hook-delete-policy: before-hook-creation
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.service.automountServiceAccountToken }}
{{- end }}
{{- end }}

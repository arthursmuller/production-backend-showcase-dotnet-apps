services:
  mariadbData:
    volumes:
      - ~/.docker-conf/inspacy-mariadb-data:/var/lib/mariadb
    environment:
      MYSQL_ROOT_PASSWORD: a608e2b2Q!
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - inspacy

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: arthur
      RABBITMQ_DEFAULT_PASS: a608e2b2
      RABBITMQ_DEFAULT_VHOST: inspacy
    volumes:
      - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq
      - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    networks:
      - inspacy

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ~/.docker-conf/minio/data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inspacy

  comment.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:80
      - SQL_CONNECTION_STRING=${COMMENT_ConnectionString}
      - RMQ_CONNECTION=${RMQ_CONNECTION_COMMENT}
      - MINIO_CONNECTION=${MINIO_CONNECTION}
      - IDENTITY_SERVICE_URL=${IDENTITY_SERVICE_URL}
      - IDENTITY_SERVICE_CLIENT_ID=${COMMENT_IDENTITY_SERVICE_CLIENT_ID}
      - IDENTITY_SERVICE_CLIENT_SECRET=${COMMENT_IDENTITY_SERVICE_CLIENT_SECRET}
    ports:
      - 5014:80
    networks:
      - inspacy

  feed.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:80
      - SQL_CONNECTION_STRING=${FEED_ConnectionString}
      - RMQ_CONNECTION=${RMQ_CONNECTION_FEED}
      - FOLLOWING_SERVICE_URL_PATH=${FOLLOWING_SERVICE_URL}
      - IDENTITY_SERVICE_URL=${IDENTITY_SERVICE_URL}
      - IDENTITY_SERVICE_CLIENT_ID=${FEED_IDENTITY_SERVICE_CLIENT_ID}
      - IDENTITY_SERVICE_CLIENT_SECRET=${FEED_IDENTITY_SERVICE_CLIENT_SECRET}
      - IDENTITY_SERVICE_CLIENT_FOLLOWING_READ_SCOPE=${FOLLOWING_IDENTITY_SERVICE_CLIENT_READ_SCOPE}
    ports:
      - 5006:80
    networks:
      - inspacy

  following.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:80
      - SQL_CONNECTION_STRING=${FOLLOWING_ConnectionString}
      - RMQ_CONNECTION=${RMQ_CONNECTION_FOLLOWING}
      - CATEGORIES_SERVICE_URL=${CATEGORIES_SERVICE_URL}
      - IDENTITY_SERVICE_URL=${IDENTITY_SERVICE_URL}
      - IDENTITY_SERVICE_CLIENT_ID=${FOLLOWING_IDENTITY_SERVICE_CLIENT_ID}
      - IDENTITY_SERVICE_CLIENT_SECRET=${FOLLOWING_IDENTITY_SERVICE_CLIENT_SECRET}
      - IDENTITY_SERVICE_CLIENT_READ_SCOPE=${FOLLOWING_IDENTITY_SERVICE_CLIENT_READ_SCOPE}
      - IDENTITY_SERVICE_CLIENT_CATEGORIES_READ_SCOPE=${CATEGORIES_IDENTITY_SERVICE_CLIENT_READ_SCOPE}
    ports:
      - 5016:80
    networks:
      - inspacy

networks:
  inspacy:
    external: true

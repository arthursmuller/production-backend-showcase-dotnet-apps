name: backend-ci

on:
  pull_request:
    paths:
      - "net-core-apps/**"
      - "global.json"
      - ".config/dotnet-tools.json"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-promotion-gate.yml"
  push:
    branches: [main]
    paths:
      - "net-core-apps/**"
      - "global.json"
      - ".config/dotnet-tools.json"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-promotion-gate.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  SOLUTION: net-core-apps/net-core-apps.sln

jobs:
  quality:
    name: Build, test, secrets, dependencies, SBOM
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate repository security and release policies
        shell: bash
        run: |
          set -euo pipefail
          bash -n net-core-apps/DevOps/security/validate-repository-security-controls.sh
          bash -n net-core-apps/DevOps/security/verify-promotion-bundle.sh
          bash net-core-apps/DevOps/security/validate-repository-security-controls.sh

      - name: Set up pinned Python for representative evidence validation
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.14"
          architecture: x64
          check-latest: false
          # setup-python caching is opt-in and is intentionally not enabled.

      - name: Validate representative exercise plan and validator invariants
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_CACHE_DIR: "1"
        run: |
          set -euo pipefail
          lock="$GITHUB_WORKSPACE/net-core-apps/Tests/PerformanceHelpers/requirements.lock.txt"
          validator="$GITHUB_WORKSPACE/net-core-apps/Tests/PerformanceHelpers/representative_evidence.py"
          tool_venv="$(mktemp -d "$RUNNER_TEMP/representative-evidence.XXXXXX")"

          cleanup() {
            if [[ -n "${tool_venv:-}" && "$tool_venv" == "$RUNNER_TEMP"/representative-evidence.* ]]; then
              rm -rf -- "$tool_venv"
            fi
          }
          trap cleanup EXIT

          python -m venv "$tool_venv"
          tool_python="$tool_venv/bin/python"
          "$tool_python" -m pip install \
            --no-cache-dir \
            --only-binary=:all: \
            --require-hashes \
            --requirement "$lock"
          "$tool_python" -m pip check
          "$tool_python" "$validator" validate-plan
          "$tool_python" "$validator" self-test

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.302

      - name: Scan repository and history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore pinned repository tools
        run: dotnet tool restore

      - name: Restore with transitive vulnerability audit
        run: >-
          dotnet restore "$SOLUTION"
          --locked-mode
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:WarningsAsErrors="NU1901;NU1902;NU1903;NU1904"

      - name: Build with warnings as errors
        run: dotnet build "$SOLUTION" --configuration Release --no-restore -warnaserror

      - name: Verify repository whitespace
        run: dotnet format "$SOLUTION" whitespace --no-restore --verify-no-changes

      - name: Run all safe automated tests
        run: >-
          dotnet test "$SOLUTION"
          --configuration Release
          --no-build
          --no-restore
          --logger "trx"
          --collect "Code Coverage;Format=cobertura"
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Enforce production line coverage floor
        run: >-
          python net-core-apps/DevOps/quality/verify-code-coverage.py
          "${{ github.workspace }}/TestResults"
          --repository-root "${{ github.workspace }}/net-core-apps"
          --minimum-line-rate 20

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0

      - name: Lint and render every production service profile
        shell: bash
        run: |
          set -euo pipefail
          chart="net-core-apps/DevOps/charts/inspacy-service"
          base="net-core-apps/DevOps/environments/production/base.values.example.yaml"
          output="rendered-manifests"
          mkdir -p "$output"
          for service in comment feed following interaction moderation; do
            profile="net-core-apps/DevOps/environments/production/${service}.values.example.yaml"
            helm lint "$chart" --values "$base" --values "$profile" --strict --kube-version 1.31.0
            helm template "inspacy-${service}" "$chart" \
              --namespace inspacy-production \
              --kube-version 1.31.0 \
              --values "$base" \
              --values "$profile" > "$output/${service}.yaml"
          done

      - name: Scan rendered Kubernetes manifests
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: config
          scan-ref: rendered-manifests
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan source and IaC for high-severity findings
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: net-core-apps
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: net-core-apps
          format: spdx-json
          output-file: backend-source.spdx.json
          upload-artifact: false

      - name: Upload source SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-source-sbom
          path: backend-source.spdx.json
          retention-days: 30

  mariadb-integration:
    name: MariaDB integration and migration rehearsal
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      MARIADB_CI_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      mariadb:
        image: mariadb:10.6.27@sha256:114d40be36852d0a019afd8458f7e1cc63fd300403b115b1f32e31130d5f671b
        env:
          MARIADB_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          MARIADB_DATABASE: inspacy_ci_shared
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.302

      - name: Wait for MariaDB health and create isolated schemas
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter publish=3306 --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          for attempt in {1..60}; do
            if docker exec -e MARIADB_PWD="$MARIADB_CI_PASSWORD" "$container_id" mariadb-admin ping --host=127.0.0.1 --user=root --silent; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "MariaDB did not become healthy in time." >&2
              exit 1
            fi
            sleep 2
          done
          docker exec -e MARIADB_PWD="$MARIADB_CI_PASSWORD" "$container_id" mariadb --user=root --execute "
              CREATE DATABASE IF NOT EXISTS inspacy_ci_comment;
              CREATE DATABASE IF NOT EXISTS inspacy_ci_feed;
              CREATE DATABASE IF NOT EXISTS inspacy_ci_following;
              CREATE DATABASE IF NOT EXISTS inspacy_ci_interaction;
              CREATE DATABASE IF NOT EXISTS inspacy_ci_moderation;
              CREATE DATABASE IF NOT EXISTS inspacy_ci_comment_migrations;
              CREATE DATABASE IF NOT EXISTS inspacy_ci_feed_migrations;
              CREATE DATABASE IF NOT EXISTS inspacy_ci_following_migrations;
              CREATE DATABASE IF NOT EXISTS inspacy_ci_interaction_migrations;
              CREATE DATABASE IF NOT EXISTS inspacy_ci_moderation_migrations;"
          {
            echo "TEST_MARIADB_CONNECTION=Server=127.0.0.1;Port=3306;Database=inspacy_ci_shared;User Id=root;Password=$MARIADB_CI_PASSWORD;SslMode=None;MaximumPoolSize=20"
            echo "COMMENT_MARIADB_TEST_CONNECTION=Server=127.0.0.1;Port=3306;Database=inspacy_ci_comment;User Id=root;Password=$MARIADB_CI_PASSWORD;SslMode=None;MaximumPoolSize=20"
            echo "FEED_MARIADB_TEST_CONNECTION=Server=127.0.0.1;Port=3306;Database=inspacy_ci_feed;User Id=root;Password=$MARIADB_CI_PASSWORD;SslMode=None;MaximumPoolSize=20"
            echo "FOLLOWING_CURSOR_MARIADB_TEST_CONNECTION=Server=127.0.0.1;Port=3306;Database=inspacy_ci_following;User Id=root;Password=$MARIADB_CI_PASSWORD;SslMode=None;MaximumPoolSize=100"
            echo "INTERACTION_MARIADB_TEST_CONNECTION=Server=127.0.0.1;Port=3306;Database=inspacy_ci_interaction;User Id=root;Password=$MARIADB_CI_PASSWORD;SslMode=None;MaximumPoolSize=20"
            echo "MODERATION_MARIADB_TEST_CONNECTION=Server=127.0.0.1;Port=3306;Database=inspacy_ci_moderation;User Id=root;Password=$MARIADB_CI_PASSWORD;SslMode=None;MaximumPoolSize=20"
          } >> "$GITHUB_ENV"

      - name: Restore pinned repository tools
        run: dotnet tool restore

      - name: Restore locked dependency graph
        run: dotnet restore "$SOLUTION" --locked-mode

      - name: Build integration graph with warnings as errors
        run: dotnet build "$SOLUTION" --configuration Release --no-restore -warnaserror

      - name: Run every real MariaDB suite
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            "net-core-apps/Tests/MariaDb.IntegrationTests/MariaDb.IntegrationTests.csproj"
            "net-core-apps/Services/Comment/Comment.Tests/Comment.IntegrationTests/Comment.IntegrationTests.csproj"
            "net-core-apps/Services/Feed/Feed.Tests/Feed.IntegrationTests/Feed.IntegrationTests.csproj"
            "net-core-apps/Services/Following/Following.Tests/Following.IntegrationTests/Following.IntegrationTests.csproj"
            "net-core-apps/Services/Interaction/Interaction.Tests/Interaction.IntegrationTests/Interaction.IntegrationTests.csproj"
            "net-core-apps/Services/Moderation/Moderation.Tests/Moderation.IntegrationTests/Moderation.IntegrationTests.csproj"
          )
          for project in "${projects[@]}"; do
            dotnet test "$project" --configuration Release --no-build --no-restore --logger "trx" --results-directory "${{ github.workspace }}/MariaDbTestResults"
          done

      - name: Reject model drift and rehearse migration recovery
        shell: bash
        working-directory: net-core-apps
        run: |
          set -euo pipefail

          verify_migrations() {
            local project="$1"
            local context="$2"
            local database="$3"
            local rollback_policy="${4:-required}"
            export Database__MariaDbSqlConnection="Server=127.0.0.1;Port=3306;Database=$database;User Id=root;Password=$MARIADB_CI_PASSWORD;SslMode=None;MaximumPoolSize=10"

            dotnet ef migrations has-pending-model-changes --project "$project" --startup-project "$project" --context "$context" --configuration Release --no-build --no-color

            mapfile -t migrations < <(
              dotnet ef migrations list --project "$project" --startup-project "$project" --context "$context" --configuration Release --no-build --no-connect --json --no-color |
                jq -r '.[].id'
            )
            if [ "${#migrations[@]}" -eq 0 ]; then
              echo "No migrations discovered for $context." >&2
              exit 1
            fi

            local latest="${migrations[${#migrations[@]}-1]}"
            local previous="0"
            if [ "${#migrations[@]}" -gt 1 ]; then
              previous="${migrations[${#migrations[@]}-2]}"
            fi

            dotnet ef database update "$latest" --project "$project" --startup-project "$project" --context "$context" --configuration Release --no-build --no-color

            if [ "$rollback_policy" = "irreversible" ]; then
              local rollback_output
              local rollback_status
              local latest_applied
              set +e
              rollback_output="$(dotnet ef database update "$previous" --project "$project" --startup-project "$project" --context "$context" --configuration Release --no-build --no-color 2>&1)"
              rollback_status=$?
              set -e
              printf '%s\n' "$rollback_output"

              if [ "$rollback_status" -eq 0 ]; then
                echo "$context removal migration unexpectedly rolled back." >&2
                exit 1
              fi
              if ! grep -q "cannot be restored" <<< "$rollback_output"; then
                echo "$context rollback failed for an unexpected reason." >&2
                exit 1
              fi

              latest_applied="$(
                dotnet ef migrations list --project "$project" --startup-project "$project" --context "$context" --configuration Release --no-build --json --no-color |
                  jq -r --arg latest "$latest" '.[] | select(.id == $latest) | .applied'
              )"
              if [ "$latest_applied" != "true" ]; then
                echo "$context did not remain at the latest migration after safe rollback refusal." >&2
                exit 1
              fi
            else
              dotnet ef database update "$previous" --project "$project" --startup-project "$project" --context "$context" --configuration Release --no-build --no-color
              dotnet ef database update "$latest" --project "$project" --startup-project "$project" --context "$context" --configuration Release --no-build --no-color
            fi
          }

          verify_migrations Services/Comment/Comment.Infraestructure/Comment.Infraestructure.csproj CommentContext inspacy_ci_comment_migrations irreversible
          verify_migrations Services/Feed/Feed.Infraestructure/Feed.Infraestructure.csproj FeedContext inspacy_ci_feed_migrations irreversible
          verify_migrations Services/Following/Following.Infraestructure/Following.Infraestructure.csproj FollowingContext inspacy_ci_following_migrations irreversible
          verify_migrations Services/Interaction/Interaction.Infraestructure/Interaction.Infraestructure.csproj InteractionDbContext inspacy_ci_interaction_migrations irreversible
          verify_migrations Services/Moderation/Moderation.Infraestructure/Moderation.Infraestructure.csproj ModerationDbContext inspacy_ci_moderation_migrations irreversible

      - name: Upload MariaDB test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mariadb-test-results
          path: MariaDbTestResults
          if-no-files-found: warn
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0,AGPL-3.0

  codeql:
    name: CodeQL C# analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.302
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66 # v3
        with:
          languages: csharp
          build-mode: manual
      - name: Restore analyzed graph from lock files
        run: >-
          dotnet restore "$SOLUTION"
          --locked-mode
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:WarningsAsErrors="NU1901;NU1902;NU1903;NU1904"
      - name: Build analyzed code
        run: dotnet build "$SOLUTION" --configuration Release --no-restore -warnaserror
      - name: Analyze
        uses: github/codeql-action/analyze@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3

  containers:
    name: Container ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: comment-api
            file: net-core-apps/DevOps/Dockerfiles/Comment.Api.Dockerfile
          - name: feed-api
            file: net-core-apps/DevOps/Dockerfiles/Feed.Api.Dockerfile
          - name: following-api
            file: net-core-apps/DevOps/Dockerfiles/Following.Api.Dockerfile
          - name: interaction-api
            file: net-core-apps/DevOps/Dockerfiles/Interaction.Api.Dockerfile
          - name: moderation-api
            file: net-core-apps/DevOps/Dockerfiles/Moderation.Api.Dockerfile
          - name: rabbitmq-delayed
            file: net-core-apps/DevOps/Dockerfiles/RabbitMq.Dockerfile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build immutable OCI artifact with SBOM and provenance
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: net-core-apps
          file: ${{ matrix.file }}
          push: false
          tags: inspacy/${{ matrix.name }}:${{ github.sha }}
          outputs: type=oci,dest=/tmp/${{ matrix.name }}.tar
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan built image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          input: /tmp/${{ matrix.name }}.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate image SPDX SBOM
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          input: /tmp/${{ matrix.name }}.tar
          format: spdx-json
          output: /tmp/${{ matrix.name }}.spdx.json
          exit-code: "0"
          skip-setup-trivy: true

      - name: Bind OCI and archive digests into release metadata
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          name="${{ matrix.name }}"
          archive="/tmp/${name}.tar"
          sbom="/tmp/${name}.spdx.json"
          metadata="/tmp/${name}.release.json"
          checksum="/tmp/${name}.tar.sha256"

          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -e '(.spdxVersion | startswith("SPDX-2.")) and ((.packages // []) | length > 0)' "$sbom" >/dev/null

          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          printf '%s  %s\n' "$archive_sha256" "${name}.tar" > "$checksum"

          index_json="$(mktemp)"
          trap 'rm -f "$index_json"' EXIT
          tar -xOf "$archive" index.json > "$index_json"
          index_digest="sha256:$(sha256sum "$index_json" | awk '{print $1}')"
          if [[ "$IMAGE_DIGEST" != "$index_digest" ]] &&
             ! jq -e --arg digest "$IMAGE_DIGEST" '.manifests | any(.digest == $digest)' "$index_json" >/dev/null; then
            echo "Build output digest is not represented by the OCI archive." >&2
            exit 1
          fi

          jq -n \
            --arg artifactName "$name" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg sourceWorkflow "$GITHUB_WORKFLOW_REF" \
            --arg sourceRunId "$GITHUB_RUN_ID" \
            --arg archiveFile "${name}.tar" \
            --arg archiveSha256 "sha256:${archive_sha256}" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg ociIndexDigest "$index_digest" \
            --arg sbomFile "${name}.spdx.json" \
            --arg sbomSha256 "sha256:$(sha256sum "$sbom" | awk '{print $1}')" \
            '{
              schemaVersion: 1,
              status: "build-evidence-not-deployment-evidence",
              artifactName: $artifactName,
              sourceCommit: $sourceCommit,
              sourceWorkflow: $sourceWorkflow,
              sourceRunId: $sourceRunId,
              archive: { file: $archiveFile, sha256: $archiveSha256 },
              image: { digest: $imageDigest, ociIndexDigest: $ociIndexDigest },
              sbom: { file: $sbomFile, sha256: $sbomSha256 }
            }' > "$metadata"

      - name: Attest main-branch artifact provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: /tmp/${{ matrix.name }}.tar

      - name: Attest signed release metadata provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: /tmp/${{ matrix.name }}.release.json

      - name: Attest image SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: /tmp/${{ matrix.name }}.tar
          sbom-path: /tmp/${{ matrix.name }}.spdx.json

      - name: Verify signed provenance before artifact promotion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          name="${{ matrix.name }}"
          (cd /tmp && sha256sum --check --strict "${name}.tar.sha256")
          gh attestation verify "/tmp/${name}.tar" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/backend-ci.yml"
          gh attestation verify "/tmp/${name}.release.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/backend-ci.yml"
          gh attestation verify "/tmp/${name}.tar" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/backend-ci.yml" \
            --predicate-type https://spdx.dev/Document/v2.3

      - name: Upload OCI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}-${{ github.sha }}
          path: |
            /tmp/${{ matrix.name }}.tar
            /tmp/${{ matrix.name }}.tar.sha256
            /tmp/${{ matrix.name }}.release.json
            /tmp/${{ matrix.name }}.spdx.json
          retention-days: 14
